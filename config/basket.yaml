# Esempio con 3 voci fittizie: sostituisci con il tuo paniere.
basket:
  - id: cereali_colazione
    label: "Cereali da colazione"
    quantity: 1
    unit_hint: "500g"
    accept:
      brands: ["CHEERIOS", "Kellogs"]
      must_include: ["cereali"]
      must_exclude: ["barrette"]
    size_tolerance_pct: 25
    allow_private_label: true
  - id: latte_ul
    label: "Latte UHT intero"
    quantity: 6
    unit_hint: "1l"
    accept:
      brands: []
      must_include: ["latte", "intero"]
      must_exclude: ["soia", "avena"]
    size_tolerance_pct: 10
    allow_private_label: true
  - id: pasta_penne
    label: "Penne rigate"
    quantity: 2
    unit_hint: "500g"
    accept:
      brands: ["Barilla", "De Cecco"]
      must_include: ["penne"]
      must_exclude: []
    size_tolerance_pct: 10
    allow_private_label: true
