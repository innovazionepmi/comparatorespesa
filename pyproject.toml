[project]
name = "spesa-compare"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic>=2", "pyyaml", "click", "python-dotenv"]

[project.optional-dependencies]
browser = ["playwright"]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
spesa = "spesa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
