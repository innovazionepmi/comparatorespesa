    accept:
      brands: ["Molisana", "Rummo", "Garofalo"]
      must_include: ["rigatoni"]
      must_exclude: ["fresc", "ripien", "sugo", "farina", "biscott", "mezzi"]
    allow_private_label: false
  - id: pasta_mezzi_rigatoni
