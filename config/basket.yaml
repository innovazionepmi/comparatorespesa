# Paniere: prodotti che compri di solito. Per ognuno il report dice dove costa meno (Gros o Esselunga)
# e segnala le offerte. Il confronto e' sul prezzo al kg/litro/pezzo del prodotto piu' economico che
# rispetta le regole di ogni riga (marca/parole chiave); non servono quantita'.
# accept.brands vuoto = qualsiasi marca. Righe con ASSUNZIONE: regola decisa da me, correggila se serve.
basket:
  # --- Pasta secca (La Molisana, Rummo o Garofalo: per ogni formato conta il piu' economico) ---
  - id: pasta_penne
    label: "Pasta Penne rigate (La Molisana/Rummo/Garofalo)"
    queries: ["pasta la molisana", "pasta rummo", "pasta garofalo"]
    accept:
      brands: ["Molisana", "Rummo", "Garofalo"]
      must_include: ["penne", "rigate"]
      must_exclude: ["fresc", "ripien", "sugo", "farina", "biscott", "mezze penne"]
    allow_private_label: false
  - id: pasta_spaghetti
    label: "Pasta Spaghetti (La Molisana/Rummo/Garofalo)"
    queries: ["pasta la molisana", "pasta rummo", "pasta garofalo"]
    accept:
      brands: ["Molisana", "Rummo", "Garofalo"]
      must_include: ["spaghetti"]
      must_exclude: ["fresc", "ripien", "sugo", "farina", "biscott"]
    allow_private_label: false
  - id: pasta_fusilli
    label: "Pasta Fusilli (La Molisana/Rummo/Garofalo)"
    queries: ["pasta la molisana", "pasta rummo", "pasta garofalo"]
    accept:
      brands: ["Molisana", "Rummo", "Garofalo"]
      must_include: ["fusilli"]
      must_exclude: ["fresc", "ripien", "sugo", "farina", "biscott"]
