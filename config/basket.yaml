# Paniere reale (formati liberi: il confronto e' sul prezzo al kg/l, non sul formato).
# Per rimettere un vincolo di formato: unit_hint: "500g" + size_tolerance_pct: 25
basket:
  - id: cereali_colazione
    label: "Cereali da colazione (Cheerios, Consilia, Nesquik)"
    quantity: 1                       # TODO_UTENTE: quanti pezzi/confezioni servono
    queries: ["cheerios", "consilia cereali", "nesquik cereali"]
    accept:
      brands: ["Cheerios", "Consilia", "Nesquik"]
      must_include: ["cereal"]        # esclude cacao in polvere ecc.
      must_exclude: ["barrett"]
    allow_private_label: false        # scarta tutte le altre marche
  - id: pasta
    label: "Pasta (La Molisana, Rummo, Garofalo)"
    quantity: 1                       # TODO_UTENTE
    queries: ["pasta la molisana", "pasta rummo", "pasta garofalo"]
    accept:
      brands: ["Molisana", "Rummo", "Garofalo"]
      must_include: []
      must_exclude: []
    allow_private_label: false
